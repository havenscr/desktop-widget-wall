[package]
name = "widget-wall-desktop"
version = "1.0.0"
description = "Widget Wall Desktop - A Tauri Desktop Application"
authors = ["Reid Havens <reid@havens-consulting.com>"]
license = "Proprietary"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
webview2-com = "0.38.2"
windows-core = "0.61.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"

# Windows APIs
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    # Audio Mixer (Core Audio API)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
    # Device property access (for audio device names)
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",
    # Process info for audio sessions
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # Recent Files (Shell Link resolution)
    "Win32_UI_Shell",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    # Window management and graphics
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # Clipboard operations (copy file to clipboard)
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Registry operations (Do Not Disturb toggle)
    "Win32_System_Registry"
] }
base64 = "0.22"

# Claude Stats - SQLite database reading
rusqlite = { version = "0.31", features = ["bundled"] }

# OAuth callback server
tiny_http = "0.12"

# HTTP client for LibreHardwareMonitor proxy and Google Maps API
ureq = "2.9"
urlencoding = "2.1"

# Recent Files - directory operations
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
