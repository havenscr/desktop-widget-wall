<!-- COUNTDOWN / FOCUS TIMER WIDGET -->
<div class="widget widget-countdown">
  <!-- Nav-dots for mode switching (right side middle) -->
  <div class="countdown-nav-dots">
    <button class="nav-dot active" data-mode="countdown" title="Days to Event">
      <span class="dot"></span>
    </button>
    <button class="nav-dot" data-mode="focus" title="Focus Timer">
      <span class="dot"></span>
    </button>
  </div>

  <!-- Header -->
  <div class="countdown-header">
    <span class="countdown-title" id="countdown-title">Days to Event</span>
    <button class="countdown-config-btn" id="countdown-config-btn" title="Configure">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <!-- COUNTDOWN MODE (Days to Event) -->
  <div class="countdown-mode" id="countdown-mode" data-mode="countdown">
    <div class="countdown-circles">
      <div class="countdown-unit">
        <div class="countdown-circle">
          <svg class="countdown-svg" viewBox="0 0 36 36">
            <circle class="countdown-bg-circle" cx="18" cy="18" r="15.5"/>
            <circle class="countdown-progress-circle" id="countdown-days-ring" cx="18" cy="18" r="15.5"
              stroke-dasharray="97.4" stroke-dashoffset="0"/>
          </svg>
          <div class="countdown-value" id="countdown-days">--</div>
        </div>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-circle">
          <svg class="countdown-svg" viewBox="0 0 36 36">
            <circle class="countdown-bg-circle" cx="18" cy="18" r="15.5"/>
            <circle class="countdown-progress-circle" id="countdown-hours-ring" cx="18" cy="18" r="15.5"
              stroke-dasharray="97.4" stroke-dashoffset="0"/>
          </svg>
          <div class="countdown-value" id="countdown-hours">--</div>
        </div>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-circle">
          <svg class="countdown-svg" viewBox="0 0 36 36">
            <circle class="countdown-bg-circle" cx="18" cy="18" r="15.5"/>
            <circle class="countdown-progress-circle" id="countdown-mins-ring" cx="18" cy="18" r="15.5"
              stroke-dasharray="97.4" stroke-dashoffset="0"/>
          </svg>
          <div class="countdown-value" id="countdown-mins">--</div>
        </div>
        <span class="countdown-label">Mins</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-circle">
          <svg class="countdown-svg" viewBox="0 0 36 36">
            <circle class="countdown-bg-circle" cx="18" cy="18" r="15.5"/>
            <circle class="countdown-progress-circle" id="countdown-secs-ring" cx="18" cy="18" r="15.5"
              stroke-dasharray="97.4" stroke-dashoffset="0"/>
          </svg>
          <div class="countdown-value" id="countdown-secs">--</div>
        </div>
        <span class="countdown-label">Secs</span>
      </div>
    </div>
  </div>

  <!-- FOCUS TIMER MODE -->
  <div class="countdown-mode focus-timer-mode" id="focus-mode" data-mode="focus" style="display: none;">
    <div class="focus-timer-layout">
      <!-- LEFT: Circle with play/pause and reset controls inside -->
      <div class="focus-timer-left">
        <div class="focus-timer-display">
          <svg class="focus-timer-svg" viewBox="0 0 100 100">
            <circle class="focus-timer-bg-circle" cx="50" cy="50" r="42"/>
            <circle class="focus-timer-progress-circle" id="focus-timer-ring" cx="50" cy="50" r="42"
              stroke-dasharray="263.89" stroke-dashoffset="0"/>
          </svg>
          <div class="focus-timer-center">
            <!-- Control buttons inside circle -->
            <div class="focus-timer-controls">
              <button class="focus-control-btn" id="focus-play-btn" title="Start/Pause">
                <svg viewBox="0 0 24 24" fill="currentColor" class="focus-play-icon">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="currentColor" class="focus-pause-icon" style="display: none;">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="currentColor" class="focus-stop-icon" style="display: none;">
                  <path d="M6 6h12v12H6z"/>
                </svg>
              </button>
              <button class="focus-control-btn" id="focus-reset-btn" title="Reset">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Time display, presets, and Focus button -->
      <div class="focus-timer-right">
        <!-- Time display above presets -->
        <div class="focus-timer-time" id="focus-timer-time">25:00</div>

        <!-- Quick preset buttons (all on one line) -->
        <div class="focus-timer-presets">
          <button class="focus-preset-btn active" data-minutes="25">25</button>
          <button class="focus-preset-btn" data-minutes="50">50</button>
          <button class="focus-preset-btn" data-minutes="90">90</button>
          <button class="focus-preset-btn" data-minutes="120">120</button>
        </div>

        <!-- Focus button with lotus icon -->
        <button class="focus-lotus-btn" id="focus-lotus-btn" title="Focus Mode">
          <img src="assets/lotus-flower.svg" alt="Focus" class="focus-lotus-icon"/>
          <span>Focus</span>
        </button>
      </div>
    </div>
  </div>
</div>
