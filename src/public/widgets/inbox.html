<!-- EMAIL WIDGET - Microsoft Outlook Integration + Twitch Chat -->
<!-- Fingerprint: AE-WWD-8B4F2C1E-2025 -->
<div class="widget widget-email">
  <div class="widget-header">
    <span class="inbox-header-text">Inbox</span>
    <!-- Account Tabs (shown when in email view) -->
    <div class="inbox-account-tabs" id="inbox-account-tabs">
      <button class="inbox-account-tab active" data-account="hc" title="Havens Consulting">
        <span class="inbox-tab-label">HC</span>
        <span class="inbox-tab-badge" id="inbox-badge-hc">0</span>
      </button>
      <button class="inbox-account-tab" data-account="ae" title="Analytic Endeavors">
        <span class="inbox-tab-label">AE</span>
        <span class="inbox-tab-badge" id="inbox-badge-ae">-</span>
      </button>
    </div>
    <span class="badge" style="display: none;">0</span>
  </div>

  <!-- View Container -->
  <div class="inbox-views-container">
    <!-- Inbox View (Default) -->
    <div class="inbox-view" id="inbox-view-email" data-view="email">
      <div class="widget-content">
        <div class="email-list">
          <div class="email-connect">
            <span>Connect Microsoft account</span>
            <small>Settings > Microsoft Account</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Twitch Chat View -->
    <div class="inbox-view" id="inbox-view-twitch-chat" data-view="twitch-chat" style="display: none;">
      <div class="twitch-chat-container" id="twitch-chat-container">
        <div class="twitch-chat-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Loading Twitch Chat...</span>
        </div>
      </div>
    </div>
  </div>
</div>
