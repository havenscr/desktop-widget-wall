<!-- CALENDAR WIDGET - Fantastical-style with mini calendar + event list -->
<!-- Fingerprint: AE-WWD-8B4F2C1E-2025 -->
<div class="widget widget-calendar">
  <div class="calendar-layout" id="calendar-layout" style="display: none;">
    <!-- Left: Mini Calendar + Info -->
    <div class="calendar-left">
      <div class="calendar-mini">
        <div class="calendar-nav">
          <button class="cal-nav-btn" id="cal-prev-month" title="Previous month">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span class="cal-month-year" id="cal-month-year">January 2025</span>
          <button class="cal-nav-btn" id="cal-next-month" title="Next month">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
        <div class="calendar-grid">
          <div class="cal-weekdays">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="cal-days" id="cal-days">
            <!-- Days generated by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Below calendar: Next meeting countdown -->
      <div class="calendar-info">
        <div class="next-meeting" id="next-meeting">
          <div class="next-header">
            <span class="next-label">NEXT EVENT</span>
            <span class="next-category" id="next-category"></span>
          </div>
          <span class="next-time" id="next-time">--</span>
          <div class="next-title-row">
            <span class="next-title" id="next-title">No upcoming meetings</span>
            <div class="next-drive-col" id="next-drive-col" style="display: none;">
              <span class="leave-indicator" id="leave-indicator" style="display: none;">Leave soon</span>
              <span class="next-drive-time" id="next-drive-time"></span>
              <button class="next-maps-btn" id="next-maps-btn" title="Get directions">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/>
                  <path d="M7 14h.01"/><path d="M17 14h.01"/>
                  <rect width="18" height="8" x="3" y="10" rx="2"/>
                  <path d="M5 18v2"/><path d="M19 18v2"/>
                </svg>
              </button>
            </div>
            <button class="next-meeting-btn" id="next-meeting-btn" style="display: none;" title="Join meeting">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Event List with date sections -->
    <div class="calendar-events">
      <div class="events-list" id="events-list">
        <!-- Date sections populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Placeholder when not connected -->
  <div class="calendar-placeholder" id="calendar-placeholder">
    <div class="placeholder-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <span>Connect Microsoft account</span>
    <small>Settings > Microsoft Account</small>
  </div>
</div>
