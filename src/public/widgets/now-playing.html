<!-- NOW PLAYING WIDGET - Windows Media Session Integration -->
<!-- Fingerprint: AE-WWD-8B4F2C1E | analyticendeavors.com -->
<div class="widget widget-nowplaying" id="nowplaying-widget">
  <!-- Album blur background element -->
  <div class="nowplaying-blur-bg" id="nowplaying-blur-bg"></div>
  <!-- Color mesh background canvas -->
  <canvas class="nowplaying-color-mesh" id="nowplaying-color-mesh"></canvas>
  <!-- Config gear icon (upper right) -->
  <button class="nowplaying-config-btn" id="nowplaying-config-btn" title="Configure Background">
    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
      <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>
  <!-- Like button - positioned upper right -->
  <button class="nowplaying-btn-like-corner" id="nowplaying-like" title="Like this track">
    <svg class="like-icon like-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <svg class="like-icon like-on" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  </button>
  <div class="nowplaying-content" id="nowplaying-content">
    <!-- Album Art (Left Side) -->
    <div class="nowplaying-art-container">
      <div class="nowplaying-art" id="nowplaying-art">
        <svg class="nowplaying-art-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
      <!-- Playback indicator overlay -->
      <div class="nowplaying-status-indicator" id="nowplaying-status-indicator">
        <div class="status-bars">
          <span></span><span></span><span></span>
        </div>
      </div>
      <!-- Streamer profile image overlay (Twitch) -->
      <div class="nowplaying-profile-overlay" id="nowplaying-profile-overlay" style="display: none;">
        <img id="nowplaying-profile-img" src="" alt="Streamer">
      </div>
    </div>

    <!-- Track Info (Right Side) -->
    <div class="nowplaying-info">
      <div class="nowplaying-source" id="nowplaying-source">--</div>
      <div class="nowplaying-title" id="nowplaying-title">No Media Playing</div>
      <div class="nowplaying-artist" id="nowplaying-artist">--</div>
      <div class="nowplaying-album" id="nowplaying-album">--</div>

      <!-- Seekable Progress Bar -->
      <div class="nowplaying-progress-container">
        <div class="nowplaying-progress nowplaying-progress-seekable" id="nowplaying-progress" title="Click to seek">
          <div class="nowplaying-progress-fill" id="nowplaying-progress-fill"></div>
          <div class="nowplaying-progress-handle" id="nowplaying-progress-handle"></div>
        </div>
        <div class="nowplaying-time">
          <span id="nowplaying-time-current">--:--</span>
          <span id="nowplaying-time-total">--:--</span>
        </div>
      </div>

      <!-- Playback Controls with Shuffle, Repeat & Like -->
      <div class="nowplaying-controls">
        <button class="nowplaying-btn nowplaying-btn-toggle" id="nowplaying-shuffle" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
        <button class="nowplaying-btn" id="nowplaying-prev" title="Previous Track">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button class="nowplaying-btn nowplaying-btn-main" id="nowplaying-playpause" title="Play/Pause">
          <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        <button class="nowplaying-btn" id="nowplaying-next" title="Next Track">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
        <button class="nowplaying-btn nowplaying-btn-toggle" id="nowplaying-repeat" title="Repeat">
          <!-- Repeat off icon (default) -->
          <svg class="repeat-icon repeat-off" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
          <!-- Repeat all icon -->
          <svg class="repeat-icon repeat-list" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
          <!-- Repeat one icon -->
          <svg class="repeat-icon repeat-track" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
            <text x="12" y="15" text-anchor="middle" font-size="8" font-weight="bold">1</text>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Fallback message when not in Tauri -->
  <div class="nowplaying-fallback" id="nowplaying-fallback" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 8v4M12 16h.01"></path>
    </svg>
    <span>Now Playing requires the desktop app</span>
  </div>
</div>
