<!-- TWITCH STREAM WIDGET -->
<div class="widget widget-twitch" id="twitch-widget">
  <button class="twitch-config-btn" id="twitch-config-btn" title="Change Channel">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>
  <button class="twitch-quickswitch-btn" id="twitch-quickswitch-btn" title="Quick Switch Channel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m17 2-5 5-5-5"/>
      <rect width="20" height="15" x="2" y="7" rx="2"/>
    </svg>
  </button>
  <div class="twitch-quickswitch-dropdown" id="twitch-quickswitch-dropdown">
    <!-- Dynamically populated with live followed channels -->
  </div>
  <!-- Twitch Embed API container -->
  <div id="twitch-embed"></div>
  <!-- HLS.js video target (Twitch Video Mode: HLS). Hidden until HLS mode activates;
       twitch.js applies inline positioning/z-index when it starts playback. -->
  <video id="hls-video" muted playsinline style="display: none;"></video>
  <!-- HLS custom controls (revealed on widget hover by showHLSControls) -->
  <div class="hls-controls" id="hls-controls" style="display: none;">
    <button class="hls-control-btn" id="hls-play-btn" title="Play / Pause">
      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button class="hls-control-btn" id="hls-mute-btn" title="Mute / Unmute">
      <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05A4.5 4.5 0 0016.5 12z"/></svg>
      <svg class="muted-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25A6.4 6.4 0 0114 17.7v2.06a8.4 8.4 0 003.66-1.51L19.73 21 21 19.73zM12 4L9.91 6.09 12 8.18zm7 8a6.5 6.5 0 01-1 3.45l1.46 1.46A8.4 8.4 0 0021 12a8.5 8.5 0 00-6-8.12v2.06A6.5 6.5 0 0119 12z"/></svg>
    </button>
    <div class="hls-controls-spacer" style="flex: 1;"></div>
    <button class="hls-control-btn" id="hls-quality-btn" title="Quality">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
    <div class="hls-quality-menu" id="hls-quality-menu" style="display: none;"></div>
  </div>
  <div class="twitch-offline" id="twitch-offline">
    <div class="twitch-offline-avatar" id="twitch-avatar">A</div>
    <div class="twitch-offline-channel" id="twitch-channel-name">Channel</div>
    <div class="twitch-offline-status">Currently Offline</div>
    <a class="twitch-offline-btn" id="twitch-channel-link" href="#" target="_blank">View Channel</a>
  </div>
  <div class="twitch-fallback" id="twitch-fallback">
    <span class="icon">&#127918;</span>
    <p>Twitch embed requires domain registration.<br>Works on registered domains only.</p>
    <a id="twitch-fallback-link" href="#" target="_blank">Open in Twitch</a>
  </div>
</div>
