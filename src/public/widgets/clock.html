<!-- CLOCK WIDGET -->
<div class="widget widget-clock">
  <!-- Settings gear icon (upper right) -->
  <button class="clock-config-btn" id="clock-config-btn" title="Configure Background">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>

  <div class="clock-inner-frame">
    <div class="clock-container">
      <div class="clock-wrapper">
        <div class="bg"></div>
        <div class="clock-time-display">
          <div class="clock-digit-group" id="clock-hours">
            <div class="clock-digit" id="h1">1</div>
            <div class="clock-digit" id="h2">2</div>
          </div>
          <span class="clock-separator">:</span>
          <div class="clock-digit-group" id="clock-minutes">
            <div class="clock-digit" id="m1">0</div>
            <div class="clock-digit" id="m2">0</div>
          </div>
          <div class="clock-ampm-container">
            <span class="clock-ampm" id="clock-ampm">PM</span>
            <button class="clock-radio-inline" id="clock-radio-inline" title="Play Radio">
              <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <span>Radio</span>
            </button>
          </div>
        </div>
      </div>
      <div class="clock-date" id="clock-date">Saturday, January 10</div>
    </div>
  </div>

  <!-- Radio Toggle Button (top-right corner) - hidden, using inline button instead -->
  <button class="clock-radio-toggle" id="clock-radio-toggle" title="Radio" style="display:none;">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.89 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z"/>
    </svg>
  </button>

  <!-- Radio Dropdown Panel -->
  <div class="clock-radio-dropdown" id="clock-radio-dropdown">
    <div class="radio-dropdown-row">
      <span class="radio-label">FM</span>
      <span class="radio-freq" id="radio-freq">98.7</span>
      <button class="radio-btn" id="radio-btn" title="Play/Pause Radio">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path class="play-icon" d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>
    <div class="radio-dropdown-row">
      <span class="radio-label">VOL</span>
      <input type="range" class="radio-volume" id="radio-volume" min="0" max="100" value="50" title="Volume">
    </div>
  </div>
</div>
