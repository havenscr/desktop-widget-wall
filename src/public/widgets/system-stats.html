<!-- SYSTEM STATS WIDGET (Combined Ring - v4) -->
<div class="widget widget-stats">
  <div class="stats-header">
    <span class="stats-title">System</span>
    <button class="stats-config-btn" id="hd-config-btn" title="Configure HD source">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.91 3.32c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.64-.06.94 0 .3.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
    <div class="stats-config-dropdown" id="hd-config-dropdown">
      <div class="stat-config-option" data-value="average">
        <span class="config-check"></span>
        All Drives (Avg)
      </div>
      <div class="stat-config-divider"></div>
      <div id="hd-drive-options">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>
  <div class="widget-content">
    <div class="stats-combined">
      <div class="combined-ring-container">
        <svg class="combined-ring-svg" viewBox="0 0 120 120">
          <!-- Background arcs - 4 rings from outer to inner: CPU, GPU, RAM, HD -->
          <circle class="arc-bg" cx="60" cy="60" r="54"/>
          <circle class="arc-bg" cx="60" cy="60" r="42"/>
          <circle class="arc-bg" cx="60" cy="60" r="30"/>
          <circle class="arc-bg" cx="60" cy="60" r="18"/>
          <!-- Progress arcs - CPU (outer), GPU, RAM, HD (inner) -->
          <circle class="arc-progress arc-cpu" id="cpu-arc" cx="60" cy="60" r="54"
            stroke-dasharray="339" stroke-dashoffset="339"/>
          <circle class="arc-progress arc-gpu" id="gpu-arc" cx="60" cy="60" r="42"
            stroke-dasharray="264" stroke-dashoffset="264"/>
          <circle class="arc-progress arc-ram" id="ram-arc" cx="60" cy="60" r="30"
            stroke-dasharray="188" stroke-dashoffset="188"/>
          <circle class="arc-progress arc-hd" id="hd-arc" cx="60" cy="60" r="18"
            stroke-dasharray="113" stroke-dashoffset="113"/>
        </svg>
      </div>
      <div class="stats-legend">
        <div class="stat-item stat-cpu">
          <span class="stat-dot"></span>
          <span class="stat-label">CPU</span>
          <span class="stat-value" id="cpu-value">--</span>
        </div>
        <div class="stat-item stat-gpu">
          <span class="stat-dot"></span>
          <span class="stat-label">GPU</span>
          <span class="stat-value" id="gpu-value">--</span>
        </div>
        <div class="stat-item stat-ram">
          <span class="stat-dot"></span>
          <span class="stat-label">RAM</span>
          <span class="stat-value" id="ram-value">--</span>
        </div>
        <div class="stat-item stat-hd">
          <span class="stat-dot"></span>
          <span class="stat-label">HD</span>
          <span class="stat-value" id="hd-value">--</span>
        </div>
      </div>
    </div>
    <div class="stats-status-row">
      <div class="stats-mode-indicator" id="stats-mode-indicator">
        <span class="mode-dot"></span>
        <span class="mode-text">Connecting</span>
      </div>
    </div>
  </div>
</div>
