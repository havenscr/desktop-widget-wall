name: Build Windows installer

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wall-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No file names that differ only by case
        working-directory: .
        run: |
          # Windows resolves module paths without regard to case, so a pair such as
          # foo.ts and Foo.tsx (or foo.ts and Foo/index.ts, or folders Src and src)
          # passes on Linux and fails the Windows build. Fail early here instead.
          git ls-files -z | awk 'BEGIN { RS = "\0"; bad = 0 }
            # key: the path as Windows sees it; stem: the same span in its real case.
            # Two paths clash only when their keys match and their stems differ.
            function note(key, stem, name) {
              if (!(key in seen)) { seen[key] = name; stems[key] = stem }
              else if (stems[key] != stem) {
                printf "Paths clash on Windows: %s and %s\n", seen[key], name
                bad = 1
              }
            }
            {
              n = split($0, part, "/"); dir = ""
              for (i = 1; i < n; i++) { dir = dir part[i] "/"; note("d:" tolower(dir), dir, dir) }
              mod = tolower($0)
              sub(/(\.d)?\.(tsx?|jsx?|mjs|cjs)$/, "", mod)
              sub(/\/index$/, "", mod)
              note("m:" mod, substr($0, 1, length(mod)), $0)
            }
            END { exit bad }'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wall/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: No mock code in the production bundle
        run: npm run prod-check

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The frontend must exist first: the Tauri context macro reads frontendDist.
      - name: Build frontend for Rust tests
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (exe + MSI + NSIS)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build Ridgeline (exe + MSI + NSIS)
        run: npm run build:wall2

      - name: Upload Ridgeline installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-2-windows
          path: |
            src-tauri/target/release/widget-wall-desktop.exe
            src-tauri/target/release/bundle/msi/Ridgeline_*.msi
            src-tauri/target/release/bundle/nsis/Ridgeline_*.exe
          if-no-files-found: error
