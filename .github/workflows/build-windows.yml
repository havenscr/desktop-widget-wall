name: Build Windows installer

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wall-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No file names that differ only by case
        working-directory: .
        run: |
          # Windows treats Foo.tsx and foo.ts as one module, so a pair like that
          # passes on Linux and fails the Windows build. Fail early here instead.
          clashes=$(git ls-files | sed -E 's/\.(tsx?|jsx?|mjs|cjs)$//' | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$clashes" ]; then
            echo "These paths differ only by case or by a script extension:"
            for c in $clashes; do git ls-files | grep -iE "^${c}(\.(tsx?|jsx?|mjs|cjs))?$"; done
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wall/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: No mock code in the production bundle
        run: npm run prod-check

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The frontend must exist first: the Tauri context macro reads frontendDist.
      - name: Build frontend for Rust tests
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (exe + MSI + NSIS)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build Ridgeline (exe + MSI + NSIS)
        run: npm run build:wall2

      - name: Upload Ridgeline installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-2-windows
          path: |
            src-tauri/target/release/widget-wall-desktop.exe
            src-tauri/target/release/bundle/msi/Ridgeline_*.msi
            src-tauri/target/release/bundle/nsis/Ridgeline_*.exe
          if-no-files-found: error
