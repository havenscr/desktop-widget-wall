name: Build Windows installer

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wall-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wall/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The frontend must exist first: the Tauri context macro reads frontendDist.
      - name: Build frontend for Rust tests
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (exe + MSI + NSIS)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build Wall 2 (exe + MSI + NSIS)
        run: npm run build:wall2

      - name: Upload Wall 2 installers
        uses: actions/upload-artifact@v7
        with:
          name: widget-wall-2-windows
          path: |
            src-tauri/target/release/widget-wall-desktop.exe
            src-tauri/target/release/bundle/msi/Widget Wall 2_*.msi
            src-tauri/target/release/bundle/nsis/Widget Wall 2_*.exe
          if-no-files-found: error
